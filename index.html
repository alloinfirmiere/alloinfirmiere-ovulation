<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>حاسبة أيام التبويض | Alloinfirmiere الطب البسيط</title>

<style>
:root{
--p:#6d28d9;
--p2:#8b5cf6;
--ink:#2b193d;
--muted:#756a82;
--line:#e8def5;
--soft:#faf7ff;
--warn:#fff7ed;
--warnink:#8a3f16
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
color:var(--ink);
background:linear-gradient(160deg,#fcfaff 0%,#f0e9ff 100%)
}

main{
width:min(760px,94%);
margin:18px auto 36px
}

.hero{
background:linear-gradient(135deg,#4c1d95,#6d28d9 58%,#a78bfa);
color:#fff;
border-radius:26px;
padding:24px;
box-shadow:0 16px 38px rgba(76,29,149,.22)
}

h1{
margin:0 0 8px;
font-size:clamp(28px,7vw,44px)
}

.hero p{
margin:0;
line-height:1.8
}

.brand{
display:inline-block;
margin-top:13px;
padding:7px 12px;
border-radius:99px;
background:#ffffff20;
border:1px solid #ffffff35;
font-weight:bold
}

.card{
margin-top:16px;
background:#fffffff2;
border:1px solid #fff;
border-radius:24px;
padding:20px;
box-shadow:0 12px 30px rgba(59,23,100,.08)
}

label{
display:block;
font-weight:800;
margin:15px 0 8px
}

input{
width:100%;
padding:14px;
border:1.5px solid var(--line);
border-radius:13px;
background:#fff;
font-size:17px
}

.segment{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.choice{
border:1.5px solid var(--line);
background:#fff;
padding:13px;
border-radius:13px;
font-weight:800;
color:#5a486d;
cursor:pointer
}

.choice.active{
background:#efe7ff;
border-color:#8b5cf6;
color:#5b21b6;
box-shadow:0 0 0 3px rgba(139,92,246,.08)
}

button{
width:100%;
padding:14px;
border:0;
border-radius:14px;
font-weight:800;
font-size:17px;
cursor:pointer
}

.primary{
margin-top:18px;
background:linear-gradient(135deg,var(--p),var(--p2));
color:#fff
}

.secondary{
margin-top:10px;
background:#f0e9ff;
color:#5b21b6
}

.share{
margin-top:10px;
background:#fff;
color:#5b21b6;
border:1.5px solid #d9c9ff
}

.err{
display:none;
margin-top:12px;
padding:11px;
border-radius:11px;
background:#fff1f2;
color:#b91c1c
}

#result{
display:none;
margin-top:20px
}

.headline{
text-align:center;
margin:4px 0 14px
}

.headline strong{
font-size:23px;
color:#5b21b6
}

.status{
margin-bottom:13px;
padding:12px 14px;
border-radius:13px;
line-height:1.7;
font-size:14px
}

.status.good{
background:#f0fdf4;
color:#166534;
border:1px solid #bbf7d0
}

.status.caution{
background:#fff7ed;
color:#9a3412;
border:1px solid #fed7aa
}

.goalbox{
margin-bottom:13px;
padding:12px 14px;
border-radius:13px;
background:#f8f5ff;
border:1px solid #e9def9;
color:#513b6e;
line-height:1.7;
font-size:14px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.item{
background:var(--soft);
border:1px solid var(--line);
border-radius:16px;
padding:15px
}

.item .t{
font-weight:800
}

.value{
margin-top:8px;
color:#5b21b6;
font-weight:800;
line-height:1.65
}

.date-line{
direction:ltr;
unicode-bidi:isolate;
text-align:center;
display:block;
font-variant-numeric:tabular-nums
}

.calendar{
margin-top:16px;
border:1px solid var(--line);
border-radius:17px;
padding:13px;
background:#fff
}

.cal-title{
text-align:center;
font-weight:800;
margin-bottom:10px;
font-size:18px
}

.week,.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px
}

.week div{
text-align:center;
font-size:12px;
color:var(--muted)
}

.day{
min-height:44px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
background:#f7f4fb;
font-weight:800
}

.empty{background:transparent}

.fertile{background:#e9dcff}

.ovulation{
background:var(--p);
color:#fff;
box-shadow:0 5px 13px rgba(109,40,217,.26)
}

.period{
outline:2px solid #f1a7b8
}

.legend{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:10px;
font-size:12px;
color:var(--muted)
}

.dot{
display:inline-block;
width:11px;
height:11px;
border-radius:4px;
margin-left:4px;
vertical-align:-1px
}

.d1{background:#e9dcff}
.d2{background:var(--p)}
.d3{border:2px solid #f1a7b8}

.info{
margin-top:15px;
padding:13px;
border-radius:13px;
background:#f8f5ff;
color:#513b6e;
line-height:1.8;
font-size:14px;
border:1px solid #e8def8
}

.note{
margin-top:12px;
padding:13px;
border-radius:13px;
background:var(--warn);
color:var(--warnink);
line-height:1.8;
font-size:14px
}

.privacy{
margin-top:10px;
text-align:center;
color:var(--muted);
font-size:12px;
line-height:1.7
}

.footer{
text-align:center;
color:var(--muted);
font-size:13px;
margin-top:16px
}

.toast{
position:fixed;
left:50%;
bottom:22px;
transform:translateX(-50%);
background:#24143f;
color:#fff;
padding:11px 15px;
border-radius:999px;
display:none;
z-index:99;
font-size:14px
}

@media(max-width:560px){
